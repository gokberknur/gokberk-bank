<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- viewport-fit=cover lets env(safe-area-inset-*) resolve to real values on notched
		     iPhones, so the bottom tab bar / sticky bars clear the home indicator + notch. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="gökberk bank — a personal pan-European bank: accounts, payments, cards, investing." />
		<!-- Tints the iOS Safari chrome to the app background; populated at runtime from the
		     resolved --gok-color-bg token (see the root +layout.svelte) so it tracks the theme. -->
		<meta name="theme-color" content="" />
		<!--
			Apply the persisted theme + density before first paint, so there is no
			flash of the wrong theme. The gok-* components and tokens both read these
			data-attributes on <html>.
		-->
		<script>
			try {
				var t = localStorage.getItem('gok-theme');
				document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
				var d = localStorage.getItem('gok-density');
				if (d === 'compact') document.documentElement.dataset.density = 'compact';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
