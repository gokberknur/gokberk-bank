<!doctype html>
<!--
	data-scale="product" freezes the display type roles at their mobile values inside the DS's
	desktop media query, so an app surface stops reading like a landing page (DS 0.6.0). Unlike
	theme and density it is not a user preference — it is a property of this surface — so it is
	static here rather than restored by the pre-paint script below.
-->
<html lang="en" data-scale="product">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- viewport-fit=cover lets env(safe-area-inset-*) resolve to real values on notched
		     iPhones, so the bottom tab bar / sticky bars clear the home indicator + notch. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="gökberk bank — a personal pan-European bank: accounts, payments, cards, investing." />
		<!-- Warms the connection to the two hosts the app fetches live market data from
		     directly in the browser (src/lib/market/providers/**), so the FX-convert and
		     crypto/invest screens don't pay a cold DNS+TLS handshake on first quote. -->
		<link rel="preconnect" href="https://api.frankfurter.dev" crossorigin />
		<link rel="preconnect" href="https://data-api.binance.vision" crossorigin />
		<!-- Tints the iOS Safari chrome to the app background; populated at runtime from the
		     resolved --gok-color-bg token (see the root +layout.svelte) so it tracks the theme. -->
		<meta name="theme-color" content="" />
		<!--
			Apply the persisted theme + density before first paint, so there is no
			flash of the wrong theme. The gok-* components and tokens both read these
			data-attributes on <html>. Only write data-theme when a choice was actually
			stored — tokens.css now ships `color-scheme: light dark` (DS 0.10.0-beta.0),
			so an unset attribute already renders the OS scheme; pinning 'light' here for
			every first-time visitor would fight that and re-introduce the bug it fixed.
		-->
		<script>
			try {
				var t = localStorage.getItem('gok-theme');
				if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
				var d = localStorage.getItem('gok-density');
				if (d === 'compact') document.documentElement.dataset.density = 'compact';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
